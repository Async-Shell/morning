<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Ayesha</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="envelope-wrapper">
            <div class="envelope">
                <div class="letter">
                    <div class="text">
                        <strong>Good Morning ASH,</strong>
                        <p>
                           Good morning, Ash! Today is the day. Take a deep breath, eat a good breakfast, and walk into that exam room with your head held high. You’ve worked so hard for this, and I know you’re going to absolutely crush it. You’ve got this! 💪🔥💖 🥰🤍💖❤️💖💖💗💗
                        </p>
                        <img src="1.gif" alt="Ayesha" class="letter-image">
                    </div>
                </div>
            </div>
            <div class="heart"></div>
        </div>
    </div>

    <script>
        const envelope = document.querySelector('.envelope-wrapper');
        envelope.addEventListener('click', () => {
            envelope.classList.toggle('flap');
        });
    </script>
</body>
</html>
