<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Ayesha</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="envelope-wrapper">
            <div class="envelope">
                <div class="letter">
                    <div class="text">
                        <strong>Good Morning ASH,</strong>
                        <p>
Good morning, Ash! ☀️🕸️ Swinging by your notifications just to check in on you. Really hoping that fever cooled down and your throat is feeling a little easier today. Take it super slow this morning, stay cozy, and let yourself rest. Thinking of you! ❤️🕷️❤️❤️💖💖💗💗
                        </p>
                        <img src="1.gif" alt="Ayesha" class="letter-image">
                    </div>
                </div>
            </div>
            <div class="heart"></div>
        </div>
    </div>

    <script>
        const envelope = document.querySelector('.envelope-wrapper');
        envelope.addEventListener('click', () => {
            envelope.classList.toggle('flap');
        });
    </script>
</body>
</html>
