<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Ayesha</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="envelope-wrapper">
            <div class="envelope">
                <div class="letter">
                    <div class="text">
                        <strong>Good Morning ASH,</strong>
                        <p>
Morning, my love. 🥰 Just a reminder that you don't have to be strong today—it's totally okay to just curl up, stay cozy, and rest. I wish I could be there to bring you a hot water bottle and pamper you, but I'm sending you all my love through the phone.😋😋❤️❤️💖💖💗💗
                        </p>
                        <img src="1.gif" alt="Ayesha" class="letter-image">
                    </div>
                </div>
            </div>
            <div class="heart"></div>
        </div>
    </div>

    <script>
        const envelope = document.querySelector('.envelope-wrapper');
        envelope.addEventListener('click', () => {
            envelope.classList.toggle('flap');
        });
    </script>
</body>
</html>
